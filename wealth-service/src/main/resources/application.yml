server:
  port: 8082

spring:
  application:
    name: wealth-service
  datasource:
    url: ${WEALTH_DB_URL:jdbc:postgresql://localhost:5432/wealth_db}
    username: ${DB_USERNAME:wealth_admin}
    password: ${DB_PASSWORD:local_dev_password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

info:
  app:
    name: Wealth Service
    description: Financial goals, portfolios and holdings service
